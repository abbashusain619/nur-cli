name: Build nur CLI binaries

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Compile Binary
      run: pyinstaller --onefile nur.py

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nur-binary-${{ runner.os }}
        path: dist/nur*